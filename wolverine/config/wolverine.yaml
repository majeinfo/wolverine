# Wolverine configuration.

# Exclude lists: named lists of IP addresses and CIDR ranges that rules can
# ignore. An entry may also be the id of another exclude list, whose entries
# are added. Lists are used in the "exclude" of:
#   - a source: its events that are in one of the lists are dropped after
#     parsing, before any rule sees them;
#   - a rule: the rule ignores the events that are in one of the lists: they
#     are not counted, so they never raise an alert or trigger its actions.
#     Other rules still see them.
# "field" is the event field holding the address to check: SourceIP (the
# default), DestIP, or a key of Fields from a source's regexp (same names as
# group_by). Included lists are checked against the including list's field.
# Add your own admin addresses, monitoring hosts, gateways...
exclude_lists:
  - id: localhost
    description: the machine itself
    entries: [127.0.0.0/8, '::1']     # quote IPv6 addresses in [...]
  # - id: admins
  #   description: administrators' networks
  #   field: SourceIP     # the default
  #   entries: [192.168.1.0/24, '2001:db8:1::/48']
  - id: trusted
    description: addresses never blocked
    entries:
      - localhost
      # - admins

# Where the position of every source (offset in a log file, cursor in the
# journal) is saved, so that a restart resumes after the last line or entry
# processed. start_at then only applies to a source the file does not know
# yet. It also keeps the alerts raised within max_lifetime across restarts.
# The directory is created if needed. Remove it to always start from
# start_at.
state_file: /var/lib/wolverine/state.json

# How long the data memorized to evaluate the rules (the events counted by a
# threshold rule, the suppressions) and the alerts raised are kept, at most
# (wall clock): they are then forgotten, even if no new event comes. The
# window and suppress of every rule must not exceed it. Default: 24h; the
# -max-lifetime option overrides it.
max_lifetime: 24h

# Directory of additional configuration files, relative to the directory of
# this file. Every *.yaml and *.yml file in it is read, in lexical order
# (10-ssh.yaml before 20-web.yaml), and its exclude lists, sources, actions
# and rules are added to those of this file. Hidden files and subdirectories are
# ignored; state_file, max_lifetime and include_dir can only be set here.
# Without this setting, rules.d is used if it exists; "" disables it.
include_dir: rules.d

sources:
  # A log file read line by line. Each line is parsed with "regexp"; its
  # named groups fill the event:
  #   timestamp                    parsed with timestamp_formats
  #   pri                          syslog priority -> severity and facility
  #   message                      the message (default: the whole line)
  #   hostname, service, category, severity, source_ip, dest_ip, username,
  #   action, status               the event fields of the same name
  #   any other name               stored in the event's Fields
  # Lines that do not match are kept as events with a parse_error field.
  - id: messages
    type: logfile
    #path: /var/log/messages
    directory: /var/log
    filename_regexp: '^messages|secure$'
    follow: true          # true: keep reading new lines (tail -F)
    start_at: beginning    # or end (only new lines, requires follow)
    # Traditional syslog ("Nov  8 10:12:01 host sshd[123]: msg") and
    # RFC 3339 timestamps ("2026-11-08T10:12:01.123456+01:00 host ...").
    regexp: '^(?:<(?P<pri>\d{1,3})>)?(?P<timestamp>[A-Z][a-z]{2} [ \d]\d \d{2}:\d{2}:\d{2}|\d{4}-\d{2}-\d{2}T\S+) (?P<hostname>\S+) (?:(?P<service>[^\s\[:]+)(?:\[(?P<pid>\d+)\])?: ?)?(?P<message>.*)$'
    timestamp_formats: [rfc3164, rfc3339]  # or Go layouts, e.g. "02/Jan/2006:15:04:05 -0700"
    # timezone: Europe/Paris   # for timestamps without one (default: local)
    category: system

  # Instead of "path": every file of a directory whose name matches
  # filename_regexp (matched against the name only, not recursive). New
  # matching files are read when they appear; rotated files are tracked by
  # inode, so a file renamed to another matching name is not read again.
  # Compressed files (gzip, bzip2) are decompressed automatically and read
  # once; a compressed copy of a file already read (logrotate's compress)
  # continues where that file stopped instead of being read again.
  # Each event gets the file name in Fields.file.
  # - id: nginx
  #   type: logfile
  #   directory: /var/log/nginx
  #   filename_regexp: '^.*access\.log$'
  #   follow: true
  #   start_at: end
  #   regexp: '^(?P<source_ip>\S+) \S+ (?P<username>\S+) \[(?P<timestamp>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+)[^"]*" (?P<status>\d{3}) .*$'
  #   timestamp_formats: ["02/Jan/2006:15:04:05 -0700"]
  #   category: web
  #   # Drop events before any rule sees them: those of exclude lists
  #   # (exclude_lists above), and those for which exclude_if, a CEL
  #   # expression (https://cel.dev), is true. Its variables: source_ip,
  #   # dest_ip, hostname, service, username, action, status, category,
  #   # severity, message, raw, source, timestamp, the other regexp groups
  #   # (method, path... here), and fields (all the other fields).
  #   # in_list(address, "list id") tests an exclude list.
  #   exclude: [localhost]
  #   exclude_if: >-
  #     in_list(source_ip, "trusted")
  #     || path == "/health"

  # "path" may name the file after the date, with macros in the file name:
  # ${year}, ${month}, ${day}, ${hour}, ${minute}, ${second}, or an
  # expression of them (govaluate syntax). The file read is the one named
  # after the current date (in timezone); when the date changes, the
  # previous file is read to its end, then the new one.
  # "${day-1}" moves the date back one day: on March 1, the path below is
  # app.log.2026-02-28 (${month} follows the shift). Other expressions, e.g.
  # ${year%100}, are computed and rounded down.
  # - id: app
  #   type: logfile
  #   path: /var/log/app/app.log.${year}-${month}-${day-1}
  #   follow: false
  #   regexp: '^(?P<message>.*)$'

  # Log files written to an S3 bucket (ALB, CloudFront, VPC flow logs,
  # S3 access logs, applications...). The bucket sends a notification of
  # each new object to an SQS queue; wolverine receives it, downloads the
  # object, decompresses it (gzip, bzip2) and parses its lines with regexp,
  # like a logfile. The message is deleted once all the lines have been
  # processed: if wolverine stops before, the file is read again later.
  # With follow: false, wolverine stops when the queue is empty.
  #
  # Credentials and region ("aws"), per source; without them, the AWS
  # SDK's defaults apply (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
  # AWS_REGION, ~/.aws/credentials and ~/.aws/config, instance role):
  #   access_key_id_env, secret_access_key_env, session_token_env:
  #       names of the environment variables holding this source's keys
  #   profile, credentials_file, config_file: a profile of the shared files
  #   region: default: from the profile or AWS_REGION, else the queue URL
  #   endpoint_url: S3/SQS-compatible service (LocalStack, MinIO...)
  # - id: alb
  #   type: aws-s3
  #   queue_url: https://sqs.eu-west-3.amazonaws.com/123456789012/alb-logs
  #   key_regexp: '\.log\.gz$'     # optional: only these objects
  #   follow: true
  #   visibility_timeout: 5m        # extended while a file is read
  #   aws:
  #     access_key_id_env: WOLVERINE_ALB_AWS_KEY_ID
  #     secret_access_key_env: WOLVERINE_ALB_AWS_SECRET
  #     # or: profile: wolverine
  #     #     credentials_file: /etc/wolverine/aws/credentials
  #     #     config_file: /etc/wolverine/aws/config
  #   regexp: '^(?P<type>\S+) (?P<timestamp>\S+) (?P<elb>\S+) (?P<source_ip>[^ :]+):\d+ \S+ \S+ \S+ \S+ (?P<status>\d{3}) .*$'
  #   timestamp_formats: [rfc3339]
  #   category: web
  #   exclude: [localhost]          # drop these events (exclude_lists)

  # The journal entries of a systemd service, read through the sd-journal
  # API. The event fields come from the journal: timestamp, hostname,
  # service (SYSLOG_IDENTIFIER, e.g. sshd-session), severity, facility, pid
  # and unit. The journal only lets the service itself write entries for its
  # unit, so other programs cannot forge them (unlike logger -t sshd in a log
  # file).
  # Reading the system journal requires root or membership in the
  # systemd-journal, adm or wheel group.
  # Do not enable it together with a log file that also receives the same
  # service's messages: each attempt would be counted twice.
  - id: sshd-journal
    type: systemd-service
    disabled: false
    unit: sshd             # same as sshd.service
    follow: true           # true: wait for new entries (journalctl -f)
    start_at: end          # or beginning (the whole journal of the unit)
    # Optional: applied to the message only, to extract more fields.
    # regexp: '^Failed (?P<auth_method>\S+) for'
    #regexp: 'invalid user <user>'
    category: authentication

actions:
  # Send the alert by email. Set the addresses and remove "disabled" to use it.
  - id: email-admin
    type: email
    disabled: true
    smtp:
      host: localhost
      port: 25                  # STARTTLS is used when the server offers it
      # username: wolverine
      # password_env: WOLVERINE_SMTP_PASSWORD   # read from the environment
      timeout: 30s
    from: wolverine@localhost
    to: [root@localhost]
    max_events: 20              # log lines included in the mail

  # Run a command on a remote host with the system ssh client (keys,
  # ~/.ssh/config and known_hosts apply; it never prompts). Here: add the
  # attacking IP to an ipset used by the firewall.
  #
  # Variables: AlertID, RuleID, Severity, Value (the rule's group_by value),
  # SourceIP, Username, Hostname (from the last event of the alert). They are
  # shell-quoted automatically, so do NOT put them inside quotes.
  - id: block-ip
    type: ssh
    disabled: true
    ssh:
      host: firewall.example.com
      port: 22
      user: wolverine
      identity_file: /etc/wolverine/id_ed25519
      timeout: 30s
    command: sudo ipset add wolverine-blocklist {{.SourceIP}} -exist

  # POST the alert as JSON (as on stdout with -detailed-events, at most
  # max_events events) to an HTTP endpoint.
  # Network errors, 429 and 5xx are retried with an exponential backoff.
  - id: webhook
    type: webhook
    disabled: true
    webhook:
      url: https://hooks.example.com/wolverine
      headers:
        X-Source: wolverine
      headers_env:                       # values read from the environment
        Authorization: WOLVERINE_WEBHOOK_TOKEN
      timeout: 10s
      retries: 2
    max_events: 20

  # Post a message to a Slack channel (incoming webhook). The webhook URL is
  # a secret: it is read from the environment and never logged.
  #
  # body is a template. Variables: AlertID, RuleID, Severity, SeverityUpper,
  # Message, Time, Value, SourceIP, Username, Hostname, Count, Events (list of
  # log lines, at most max_events), MoreEvents. Values are escaped for use
  # INSIDE JSON strings ("..."); escape: slack also neutralises Slack's
  # <links>, <!channel> mentions and &.
  - id: slack
    type: webhook
    disabled: true
    webhook:
      url_env: WOLVERINE_SLACK_WEBHOOK_URL
      timeout: 10s
      retries: 2
      escape: slack
      body: |
        {
          "text": ":rotating_light: *[{{.SeverityUpper}}] {{.Message}}*\nRule `{{.RuleID}}` on {{.Hostname}} at {{.Time}}\n```{{range .Events}}{{.}}\n{{end}}{{if .MoreEvents}}... {{.MoreEvents}} more{{end}}```"
        }
    max_events: 10

rules:
  # Repeated failed SSH logins from the same IP (brute force).
  #
  # Only "Failed <method> for ..." messages are counted (they carry an
  # auth_method field): sshd also logs "Invalid user" and pam_unix
  # "authentication failure" lines for the same attempt, which would count it
  # two or three times.
  - id: ssh-failed-logins-per-ip
    type: threshold
    description: Repeated failed SSH logins from the same IP
    severity: high
    match:
      category: authentication
      #action: login
      #status: failure
      #has_fields: [auth_method]
    group_by: SourceIP   # Event field name, or a key of Event.Fields
    count: 3
    window: 5m
    suppress: 1h         # at most one alert per IP and per hour
    exclude: [trusted]   # ignore the failures from these addresses
    # The rule also ignores the events for which this CEL expression is
    # true (same variables as a source's exclude_if, with the regexp groups
    # of every source). Other rules still see them.
    # exclude_if: username == "deploy" && in_list(source_ip, "trusted")
    actions: [email-admin, block-ip, webhook, slack]
